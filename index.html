<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MPI Berpikir Komputasional</title>

    <!-- Mode aplikasi (Tambahkan ke Layar Utama): tampil tanpa bilah alamat browser -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1a1b2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MPI BK">

    <!-- Ikon & logo aplikasi (berkasnya di assets/icon/) -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">

    <link rel="stylesheet" href="css/style.css">
    <!-- Ukuran kanvas dihitung sedini mungkin, dan kanvas baru ditampilkan setelah aplikasi siap,
         supaya tidak ada tampilan setengah jadi yang berkedip saat halaman dimuat. -->
    <script>
        (function () {
            var vv = window.visualViewport;
            var w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
            var r = document.documentElement.style;
            r.setProperty('--canvas-scale', Math.min(w / 1280, h / 720));
            r.setProperty('--canvas-x', ((vv ? vv.offsetLeft : 0) + w / 2) + 'px');
            r.setProperty('--canvas-y', ((vv ? vv.offsetTop : 0) + h / 2) + 'px');
            // Pengaman: bila karena suatu hal aplikasi gagal memberi tanda siap, kanvas tetap ditampilkan
            setTimeout(function () { document.documentElement.classList.add('app-siap'); }, 6000);
        })();
    </script>
</head>
<body>
    <div id="landscape-warning">
        <div class="warning-content">
            <svg viewBox="0 0 24 24" width="80" height="80" fill="white">
                <path d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm1 19c0 .55-.45 1-1 1H8c-.55 0-1-.45-1-1V4c0-.55.45-1 1-1h8c.55 0 1 .45 1 1v16z"/>
            </svg>
            <h2>Mohon Putar HP Anda</h2>
            <p>Media pembelajaran ini didesain untuk posisi mendatar (landscape). Silakan putar layar HP Anda agar materi terlihat dengan jelas oleh murid.</p>
        </div>
    </div>

    <div id="app-container">
        <main id="content-area">
            <!-- Konten halaman akan dimuat di sini oleh JavaScript -->
        </main>

    </div>
    <script src="js/dialogueData.js"></script>
    <script src="js/materiData.js"></script>
    <script src="js/kisiKisiData.js"></script>
    <script src="js/app.js"></script>
    <script src="js/kisiKisi.js"></script>
    <script src="js/simulasiData.js"></script>
    <script src="js/simulasi.js"></script>
    <script src="js/pasang.js"></script>
    <script src="js/pengaturan.js"></script>
    <script src="js/musik.js"></script>
</body>
</html>
