<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- LOGO SEMENTARA MPI Berpikir Komputasional: empat pilar (dekomposisi, pengenalan pola,
       abstraksi, algoritma) yang naik bertahap dengan bintang ide di atasnya. Ganti dengan logo resmi nanti. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="1" stop-color="#14152a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f1c40f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#f1c40f" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f1c40f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- empat pilar -->
  <g>
    <rect x="118" y="292" width="54" height="110" rx="14" fill="#3498db"/>
    <rect x="190" y="250" width="54" height="152" rx="14" fill="#e67e22"/>
    <rect x="262" y="208" width="54" height="194" rx="14" fill="#2ecc71"/>
    <rect x="334" y="166" width="54" height="236" rx="14" fill="#9b59b6"/>
  </g>
  <!-- garis dasar -->
  <rect x="104" y="410" width="298" height="12" rx="6" fill="#edf2f4" opacity="0.85"/>
  <!-- bintang ide -->
  <path d="M190 96 L203 136 L244 149 L203 162 L190 202 L177 162 L136 149 L177 136 Z" fill="url(#gold)"/>
  <circle cx="262" cy="118" r="9" fill="#f1c40f" opacity="0.8"/>
  <circle cx="122" cy="214" r="6" fill="#f1c40f" opacity="0.6"/>
</svg>
